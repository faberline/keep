[project]
name = "keep"
cap_path = "README.md"
label = "app:keep"

[capability.profile]
traits = ["long_running", "cli_facing", "competitive_replacement", "network_exposed", "http2_api", "kubernetes_native", "primary_replicas"]

[ec.efficiency]
tool = "meter"
meter = "."
