[project]
name = "keep"
kind = "saas-service"
cap_path = "README.md"
label = "app:keep"

[capability.profile]
traits = ["long_running", "cli_facing", "competitive_replacement", "network_exposed", "http2_api", "kubernetes_native", "primary_replicas"]

[ec.efficiency]
tool = "meter"
meter = "."
command = "vat run meter-efficiency"

[[workspaces]]
name = "keep"
paths = ["crates/**"]
target = "rust"
test_cmd = "cargo test --workspace"
codegen.profile = "rust/score-crate"

