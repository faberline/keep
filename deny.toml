# cargo-deny configuration
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
version = 2
# Each ignore is an unmaintained-crate advisory (not a vulnerability) with no
# safe upgrade. The crate comes in through a dependency that cannot move off it.
ignore = [
    { id = "RUSTSEC-2025-0012", reason = "backoff 0.4.0 is unmaintained; no safe upgrade. Pulled in only through kube-runtime, a dev-dependency of keep." },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 is unmaintained; no safe upgrade. Pulled in only through backoff, a dev-dependency path of keep." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained; no safe upgrade. Pulled in by the workspace crates keep-keyspace and keep-replication." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained; no safe upgrade. Build-time only, pulled in by utoipa-gen 4.x." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained; no safe upgrade. Pulled in by kube-client (dev-dependency path only)." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 is unmaintained; no safe upgrade. Pulled in by serde_yaml 0.9 (deprecated), which kube-client and keep use." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# The faberline/core crates at tag v0.4.14 do not set a `license` field.
# The core repository is MIT (its workspace `license = "MIT"`).
[[licenses.clarify]]
name = "cli-std"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "metrics-prometheus"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "peer-tls"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "raft-runtime"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "server-http"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "server-lifecycle"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "server-tcp"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "service-auth"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "service-backup"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "service-http"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "service-k8s"
expression = "MIT"
license-files = []

[[licenses.clarify]]
