# cargo-deny configuration
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
version = 2
# Each ignore is an unmaintained-crate advisory with no safe upgrade, except
# RUSTSEC-2026-0600: a vulnerability that is not reachable here (see its reason).
# Ignore no other vulnerability. The crate comes in through a dependency that
# cannot move off it.
ignore = [
    { id = "RUSTSEC-2025-0012", reason = "backoff 0.4.0 is unmaintained; no safe upgrade. Path: kube-runtime 0.98.0 -> backoff 0.4.0 (kube-runtime is used through kube by keep-operator and the keep tests)." },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 is unmaintained; no safe upgrade. Path: kube-runtime 0.98.0 -> backoff 0.4.0 -> instant 0.1.13." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained; no safe upgrade. Path: workspace crates keep-keyspace and keep-storage -> bincode 1.3.3." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained; no safe upgrade. Path: kube-client 0.98.0 -> rustls-pemfile 2.2.0." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 is unmaintained; no safe upgrade. Path: serde_yaml 0.9.34 (deprecated; used by keep, keep-commands, keep-operator and kube-client) -> unsafe-libyaml 0.2.11." },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.44 is unmaintained; no safe upgrade. Path: k8s-openapi 0.24.0 (used by keep-operator) -> chrono 0.4.44; and kube 0.98.0 (used by keep-operator and, as a dev dependency, by keep) -> chrono 0.4.44." },
    { id = "RUSTSEC-2026-0600", reason = "kube-client 0.98.0 openssl-tls connector; this workspace builds the rustls-tls connector only (no openssl crate in Cargo.lock), so the flaw is not reachable. The fix is kube >= 4.2.1 and needs a core release that moves service-k8s off kube 0.98 (faberline/core#641). Path: kube 0.98.0 (used by keep-operator and, as a dev dependency, by keep) -> kube-client 0.98.0. Expires 2027-02-16." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# The faberline/core crates at tag v0.4.14 do not set a `license` field.
# The core repository is MIT (its workspace `license = "MIT"`).
