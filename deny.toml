[bans]
multiple-versions = "warn"
wildcards = "allow"  # Allow path dependencies in workspace
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# faberline/core is pinned by git (tag v0.4.14) for the shared crates.
allow-git = ["https://github.com/faberline/core"]
