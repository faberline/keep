version = 1
name = "keep-ec"
default_runner = "meter-efficiency"

[workspace]
base = "."
workdir = "."
keep = "always"

[[setup]]
id = "build-aw-tools"
cmd = ["sh", "-c", "command -v meter >/dev/null && command -v guard >/dev/null || { echo \"install the gate tools: cargo install --locked --git https://github.com/faberline/meter meter-cli; cargo install --locked --git https://github.com/faberline/guard guard-cli\" >&2; exit 1; }"]

[[setup]]
id = "build-keep-ec-tests"
cmd = [
  "cargo",
  "test",
  "-p",
  "keep",
  "--test",
  "http_api",
  "--test",
  "collections_api",
  "--test",
  "durability",
  "--no-run",
]

[[runners]]
id = "meter-efficiency"
cmd = [
  "meter",
  "test",
  "--",
  "-p",
  "keep",
  "--test",
  "http_api",
  "--test",
  "collections_api",
  "--test",
  "durability",
  "--",
  "--nocapture",
]
timeout_s = 600

[[runners]]
id = "guard-security"
cmd = [
  "guard",
  "scan",
  ".",
  "--profile",
  "security-lint",
  "--compact",
  "--no-persist",
  "--meter-command",
  "meter test -- -p keep --test http_api -- --nocapture",
]
timeout_s = 600
