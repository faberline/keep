version = 1
name = "keep-ec"
default_runner = "meter-efficiency"

[workspace]
base = "."
workdir = "."
keep = "always"

[[setup]]
id = "build-aw-tools"
cmd = ["sh", "-c", "command -v meter >/dev/null || { echo \"install the gate tool: cargo install --locked --git https://github.com/faberline/meter meter-cli\" >&2; exit 1; }"]

[[setup]]
id = "build-keep-ec-tests"
cmd = [
  "cargo",
  "test",
  "-p",
  "keep",
  "--test",
  "it",
  "--no-run",
]

[[runners]]
id = "meter-efficiency"
cmd = [
  "meter",
  "test",
  "--",
  "-p",
  "keep",
  "--test",
  "it",
  "--",
  "http_api::",
  "collections_api::",
  "durability::",
  "--nocapture",
]
timeout_s = 600

[[runners]]
id = "security-runtime"
cmd = ["cargo","test","-p","keep","--test","it","--","https_api::","http_api::","--nocapture"]
timeout_s = 600

# Competitive ratchet vs pinned Redis/Dragonfly/KeyDB/Garnet containers.
# Release-only (~20 min); needs Docker. See
# external-contracts/competitor-performance/efficiency/perf-gate.md.
[[runners]]
id = "perf-gate-competitors"
cmd = [
  "sh",
  "-c",
  "docker build -f Dockerfile.bench -t keep-bench:gate . && cargo test --release -p keep --test perf_gate_vs_kv competitive_perf_gate -- --ignored --exact --nocapture --test-threads=1",
]
timeout_s = 3600

