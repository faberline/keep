# The keep operator: a controller that watches Keep objects cluster-wide. Runs
# the `keep` binary as `keep k8s operator run`, which needs an image built with
# `--features operator` (`docker build --build-arg CARGO_FEATURES=operator`);
# the default release image does not include it. HA-safe: a coordination.k8s.io
# Lease elects one active reconciler, so this can be scaled to replicas > 1 (the
# others stand by).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keep-operator
  namespace: keep-system
  labels:
    app.kubernetes.io/name: keep-operator
    app.kubernetes.io/part-of: keep
spec:
  # Scale to 2+ for HA — leader-election guarantees a single active reconciler.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: keep-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keep-operator
    spec:
      serviceAccountName: keep-operator
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: keep:0.4.13
          imagePullPolicy: IfNotPresent
          command: ["keep", "k8s", "operator", "run"]
          env:
            - name: RUST_LOG
              value: "info"
            # Operator logs use the same schema-valid JSONL contract as the
            # data plane; collection and Sift routing stay deployment-owned.
            - name: KEEP_LOG_FORMAT
              value: "json"
            # Leader-election identity + the namespace the Lease lives in.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
