# Shared GKE test cluster overlay. faberline/aw deploys it through
# .github/workflows/gke-test.yml; the rules are in aw's
# docs/standards/test-cluster.md.
#
# - nodeSelector + toleration: run only on pool-keep-server (aw's
#   infra/gke-test/pools.yaml: e2-standard-4, because keep requests 2 CPU).
# - One pod per node: a required pod anti-affinity that matches every pod of
#   the namespace, so each replica has a node of its own. keep has 1 replica
#   today; pool-keep-server needs max_nodes >= replicas when that grows.
# - Requests without limits: the base sets limits for real clusters; the
#   overlay removes them so the pod can use the whole node.
# - The test client is a Job in k8s/gke-test-job/ on pool-keep-client.
# - ghcr-pull: the run creates this pull secret from its GITHUB_TOKEN.
# - The run sets the image; a REPLACE_ME left here fails the run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: keep
    newName: ghcr.io/faberline/keep
    newTag: REPLACE_ME__TAG
patches:
  - target:
      kind: StatefulSet
      name: keep
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: keep
      spec:
        template:
          spec:
            nodeSelector:
              faberline.dev/pool: keep-server
            tolerations:
              - key: faberline.dev/pool
                operator: Equal
                value: keep-server
                effect: NoSchedule
            imagePullSecrets:
              - name: ghcr-pull
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector: {}
  - target:
      kind: StatefulSet
      name: keep
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits
