# Release qualification: runs on an RC tag or a final keep tag.
# It runs every job of ci.yml (workflow_call) and the performance gate.
# The tag itself is created elsewhere.
name: release

on:
  push:
    tags:
      - "keep@[0-9]*.[0-9]*.[0-9]*"
      - "keep@[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*"

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = "tag"
          [[ "$TAG" =~ ^keep@[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$GITHUB_SHA"
          count=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${TAG}" --jq "[.[] | select(.ref == \"refs/heads/${TAG}\")] | length")
          test "$count" = "0"

  ci:
    name: ci
    needs: preflight
    uses: ./.github/workflows/ci.yml

  perf:
    name: "perf: competitor gate"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ubuntu-latest has 4 CPUs; a server with N cores needs N+2 CPUs, so the gate runs the 1-core cells here (keep#92).
      KEEP_PERF_HOST_CLASS: gha-ubuntu-latest
      KEEP_PERF_CORES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-perf
      - name: Build the bench image
        run: docker build -f Dockerfile.bench -t keep-bench:gate .
      - name: Run the gate
        run: cargo test --locked --release -p keep --test perf_gate_vs_kv competitive_perf_gate -- --ignored --exact --nocapture --test-threads=1
