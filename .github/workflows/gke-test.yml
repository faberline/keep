# Deploy keep to the shared faberline GKE test cluster and run
# scripts/gke-test/verify.sh against it. faberline/aw owns the cluster, the
# pool (pool-keep), and the reusable workflow; keep owns
# k8s/overlays/gke-test/ and the test command. Rules: aw's
# docs/standards/test-cluster.md.
#
# Every pool is at 0 nodes between runs, so the first rollout waits a few
# minutes for the autoscaler to add a node. The run always deletes the
# namespace, even when the test fails.
name: gke-test

on:
  pull_request:
    paths:
      - "k8s/**"
      - "scripts/gke-test/**"
      - ".github/workflows/gke-test.yml"
      - ".github/workflows/keep-test-image.yml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/keep-test-image.yml

  gke-test:
    needs: image
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@main
    with:
      image: ${{ needs.image.outputs.image }}
      test-command: scripts/gke-test/verify.sh
