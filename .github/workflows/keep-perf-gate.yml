name: keep-perf-gate

# Competitive perf ratchet (issue #2): keep vs pinned Redis / Dragonfly
# (ratchet) and KeyDB / Garnet (report-only). Release-only, ~20 min, so it runs
# nightly and on demand, never per PR. See
# external-contracts/competitor-performance/efficiency/competitor-ratchet.md.
#
# GitHub-hosted runners have 4 vCPUs, so this host class gates the 1-core
# cells only (a 4-core server needs a disjoint load generator on >= 6 CPUs).
# Record the class once with `record: "1"`, download the `perf-baseline`
# artifact, and commit it; until then the nightly fails closed with
# "no baseline for host class".

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      record:
        description: 'Re-record the baseline: "" (gate), "1" (raise-only), or "force" (may lower; needs note).'
        required: false
        default: ""
        type: string
      note:
        description: Reason for a forced re-record (stored in the baseline).
        required: false
        default: ""
        type: string

concurrency:
  group: keep-perf-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  competitors:
    name: competitor ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEEP_PERF_HOST_CLASS: linux-x86_64-gha-4c
      KEEP_PERF_NETWORK: host
      KEEP_PERF_CORES: "1"
      KEEP_PERF_RECORD: ${{ inputs.record }}
      KEEP_PERF_NOTE: ${{ inputs.note }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the keep bench image
        run: docker build -f Dockerfile.bench -t keep-bench:gate .
      - name: Unit-test the gate logic
        run: cargo test --locked -p keep --test perf_gate_vs_kv
      - name: Run the competitor ratchet
        run: >
          cargo test --locked --release -p keep --test perf_gate_vs_kv
          competitive_perf_gate -- --ignored --exact --nocapture --test-threads=1
      - name: Upload the recorded baseline
        if: ${{ inputs.record != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-baseline
          path: crates/keep/tests/perf-baseline.json
