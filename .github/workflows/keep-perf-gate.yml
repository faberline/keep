# Nightly competitor perf gate (keep#31).
# Runs the ratchet test `competitive_perf_gate` on a Linux runner. It is not
# required by the ruleset, and it runs only on a schedule or by hand, so a
# nightly run never blocks a pull request.
name: keep-perf-gate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      record:
        description: "Record the Linux baseline (1) or check against it (none)"
        type: choice
        default: "none"
        options:
          - none
          - "1"

permissions:
  contents: read

concurrency:
  group: keep-perf-gate
  cancel-in-progress: false

jobs:
  perf-gate:
    name: "perf: competitor gate"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEEP_PERF_HOST_CLASS: gha-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-perf
      - name: Build the bench image
        run: docker build -f Dockerfile.bench -t keep-bench:gate .
      - name: Run the gate
        env:
          KEEP_PERF_RECORD: ${{ inputs.record == '1' && '1' || '' }}
        run: cargo test --locked --release -p keep --test perf_gate_vs_kv competitive_perf_gate -- --ignored --exact --nocapture --test-threads=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.record == '1' }}
        with:
          name: perf-baseline
          path: crates/keep/tests/perf-baseline.json
          if-no-files-found: error
