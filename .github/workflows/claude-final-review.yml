# Register actual workflow IDs/blobs/job names in default-branch policy first.
# Supply a separately reviewed, hash-verified Claude CLI at /usr/local/bin/claude
# on an ephemeral Linux runner. This template never installs a mutable CLI.
name: Claude final review
run-name: AW Claude review PR ${{ github.event.workflow_run.pull_requests[0].number }} head ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["keep-ci"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: claude-final-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.preflight.outputs.eligible }}
      pr: ${{ steps.preflight.outputs.pr }}
      head: ${{ steps.preflight.outputs.head }}
    steps:
      - name: Require complete trusted qualification before paid review
        uses: faberline/aw/.github/actions/issue-ci@8e2e93e5ba8feb30b6668de39139980ea3bb085c
        with:
          operation: qualify
          pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          head: ${{ github.event.workflow_run.head_sha }}
      - uses: faberline/aw/.github/actions/claude-review@8e2e93e5ba8feb30b6668de39139980ea3bb085c
        id: preflight
        with:
          operation: preflight
          pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          head: ${{ github.event.workflow_run.head_sha }}
          review-run: ${{ github.run_id }}
  review:
    timeout-minutes: 70
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted provisioning source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/issue-ci/provision-claude.py
            .github/claude-review-cli-supply.json
      - name: Verify fixed signed official CLI without credentials
        id: provision
        run: python3 -I scripts/issue-ci/provision-claude.py
      - name: Install verified binary on the disposable runner
        env:
          VERIFIED_BINARY: ${{ steps.provision.outputs.binary }}
        run: sudo install -m 0755 -- "$VERIFIED_BINARY" /usr/local/bin/claude
      # Never checkout PR code, restore its caches, install its packages or run
      # its scripts on a credentialed runner. No other step gets this secret.
      - uses: faberline/aw/.github/actions/claude-review@8e2e93e5ba8feb30b6668de39139980ea3bb085c
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          operation: review
          pr: ${{ needs.preflight.outputs.pr }}
          head: ${{ needs.preflight.outputs.head }}
          review-run: ${{ github.run_id }}
