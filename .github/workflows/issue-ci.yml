# Replace the existing .github/workflows/issue-ci.yml with this ONE writer.
# Every event reconciles both CI handoff and Claude outcomes for the full queue.
# Install with the pinned action, real producer identity and strict provider
# ruleset. Qualification holds prohibit merge but permit verified rejection.
name: Issue CI and Claude outcome
on:
  workflow_run:
    workflows: ["keep-ci", "Claude final review"]
    types: [requested, in_progress, completed]
  issues:
    types: [edited, reopened, closed, labeled, unlabeled]
  pull_request_target:
    branches: [main] # Use the verified default branch before joining concurrency.
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: issue-ci-handoff
  cancel-in-progress: false
jobs:
  native-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
      issues: write
    steps:
      # No checkout, model, Claude credential, PR artifact or PR program.
      # Every wake recomputes all open PRs, including displaced pending wakes.
      - uses: faberline/aw/.github/actions/native-auto-merge@8e2e93e5ba8feb30b6668de39139980ea3bb085c
