# CI stages: lint -> test -> gate (the aw CI standard, docs/standards/ci.md).
# The ruleset requires only the "gate" job. Keep its name fixed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile's toolchain, so a new stable release does not fail PRs.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-ci
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --json --summary-only --output-path target/coverage.json
      - uses: faberline/aw/.github/actions/coverage@40ea346f14deda469089bb104d969624d4f924c6 # S8
        with:
          summary: target/coverage.json
      - run: cargo test --locked --workspace --doc
      - run: "cargo test --locked -p keep --features operator --test it operator::"
      - run: "cargo test --locked -p keep --features raft --test it raft_failover::"
      - run: "cargo test --locked -p keep --features raft --test it raft_node::"
      - run: "cargo test --locked -p keep --features raft --test it rolling_restart::"
      - run: "cargo test --locked -p keep --features raft --test it peer_mtls::"
      - run: "cargo test --locked -p keep --features raft --test it raft_membership::"
      - run: cargo test --locked -p keep-replication --features raft --lib
      - run: cargo test --locked -p keep --features raft --bin keep
      - run: "cargo test --locked -p keep --features operator --test it api_surface::"

  test-release-contract:
    name: "test: release contract"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-ci
      - name: Release contract
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q --locked -p keep-release-gate -- verify-release-contract --app keep

  test-deny:
    name: "test: cargo deny"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-ci
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check advisories licenses bans sources

  test-audit:
    name: "test: cargo audit"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-ci
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.23.0
      # The six unmaintained-crate advisories of deny.toml are reported by
      # cargo audit as warnings, so `--deny warnings` would always fail.
      # Vulnerabilities fail the job by default; also deny unsound and yanked.
      - run: cargo audit --deny unsound --deny yanked

  test-k8s:
    name: "test: kubernetes manifests"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render gke-test overlay
        run: kubectl kustomize k8s/overlays/gke-test > /dev/null
      - run: shellcheck -x -S warning k8s/gke-test-job/verify.sh
      - run: kubectl kustomize k8s/gke-test-job > /dev/null
      - name: Render gke-test raft overlay
        run: kubectl kustomize k8s/overlays/gke-test-raft > /dev/null
      - run: shellcheck -x -S warning k8s/gke-test-job-raft/verify-raft.sh
      - run: kubectl kustomize k8s/gke-test-job-raft > /dev/null

  test-quickstart-image:
    name: "test: quickstart on the image"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: keep-ci
      - name: Build the image (from source)
        run: docker build -f Dockerfile -t keep:local .
      - name: Run the quickstart commands against the image
        run: "cargo test --locked -p keep --test it quickstart_image::quickstart_runs_on_the_image -- --ignored --exact"

  gate:
    name: gate
    if: always()
    needs: [lint, test-coverage, test-release-contract, test-deny, test-audit, test-k8s, test-quickstart-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
