[workspace]
resolver = "2"
members = [
    "crates/keep",
    "crates/keep-access",
    "crates/keep-client",
    "crates/keep-commands",
    "crates/keep-keyspace",
    "crates/keep-operator",
    "crates/keep-replication",
    "crates/keep-shared-kernel",
    "crates/keep-storage",
]
default-members = ["crates/keep"]

[workspace.package]
version = "0.4.13"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/keep"

[workspace.dependencies]
# Internal keep crates
keep-access = { path = "crates/keep-access", version = "0.4.13" }
keep-client = { path = "crates/keep-client", version = "0.4.13" }
keep-commands = { path = "crates/keep-commands", version = "0.4.13" }
keep-keyspace = { path = "crates/keep-keyspace", version = "0.4.13" }
keep-operator = { path = "crates/keep-operator", version = "0.4.13" }
keep-replication = { path = "crates/keep-replication", version = "0.4.13" }
keep-shared-kernel = { path = "crates/keep-shared-kernel", version = "0.4.13" }
keep-storage = { path = "crates/keep-storage", version = "0.4.13" }

# Shared faberline/core crates
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
claim-token = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14", version = "0.5" }
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

# Async runtime & core utilities
anyhow = "1.0"
arc-swap = "1"
async-trait = "0.1"
bincode = "1.3"
clap = { version = "4", features = ["derive", "string", "env"] }
crc32fast = "1.4"
crossbeam-channel = "0.5"
futures = "0.3"
parking_lot = "0.12"
rust_decimal = { version = "1.36", features = ["serde"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

# HTTP/2 & OpenAPI
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
utoipa = { version = "4", features = ["axum_extras"] }

# Kubernetes operator
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
schemars = "0.8"

# Dev / benchmark dependencies
criterion = "0.5"
redis = { version = "0.27", features = ["tokio-comp"] }
tempfile = "3.12"
tokio-test = "0.4"

# A module is a file `src/<name>.rs`, never `src/<name>/mod.rs`.
[workspace.lints.clippy]
mod_module_files = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
